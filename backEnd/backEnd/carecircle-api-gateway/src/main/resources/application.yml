spring:
  application:
    name: carecircle-api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "https://care-circle-ruby.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: lb://carecircle-auth-service
          predicates:
            - Path=/auth/**,/family/members/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**

        - id: chat-app
          uri: lb://ChatApp
          predicates:
            - Path=/api/chat/**

        - id: emergency-service
          uri: lb://emergency-service
          predicates:
            - Path=/api/emergency/**

        - id: health-record-service
          uri: lb://health-record-service
          predicates:
            - Path=/api/records/**

        - id: medicine-medications
          uri: lb://medicine-service
          predicates:
            - Path=/api/v1/medications/**

        - id: medicine-inventory
          uri: lb://medicine-service
          predicates:
            - Path=/api/v1/medicines/**

        - id: medicine-intake
          uri: lb://medicine-service
          predicates:
            - Path=/api/medicine-intake/**

        - id: medicine-stock
          uri: lb://medicine-service
          predicates:
            - Path=/api/stock-transactions/**

        - id: health-metrics-service
          uri: lb://health-metrics-service
          predicates:
            - Path=/api/v1/health-metrics/**

server:
  port: ${PORT:8090}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty.http.client: DEBUG
    com.carecircle.gateway: DEBUG
